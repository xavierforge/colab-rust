name: Build prebuilt binaries

# Builds evcxr_jupyter on ubuntu-22.04 (glibc 2.35, the oldest image setup.sh
# supports), smoke-tests the tarball on 24.04 and 22.04 through setup.sh,
# and only then publishes it to the prebuilt-latest release together with a
# manifest that records what it was built with. setup.sh checks the tarball
# against that manifest before installing it.

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    tags:
      - "prebuilt-v*"
  workflow_dispatch:

jobs:
  build-evcxr:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake pkg-config libssl-dev libzmq3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain
        run: rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Install evcxr_jupyter
        run: cargo install --locked --root ./out evcxr_jupyter

      - name: Package with manifest
        run: |
          set -euo pipefail
          GLIBC=$(ldd --version | awk 'NR==1{print $NF}')
          NAME="evcxr_jupyter-ubuntu22.04-glibc${GLIBC}"
          STAGE="$RUNNER_TEMP/stage"; mkdir -p "$STAGE"
          tar -C out/bin -czf "$STAGE/$NAME.tar.gz" evcxr_jupyter
          EVCXR_VERSION=$(cargo install --list --root ./out | sed -n 's/^evcxr_jupyter v\([^ :]*\).*/\1/p')
          [ -n "$EVCXR_VERSION" ] || { echo "could not read the evcxr_jupyter version from cargo install --list"; exit 1; }
          python3 - "$STAGE" "$NAME" "$EVCXR_VERSION" "$GLIBC" <<'PY'
          import datetime, hashlib, json, os, subprocess, sys
          stage, name, evcxr_version, glibc = sys.argv[1:]
          tarball = f"{stage}/{name}.tar.gz"
          with open(tarball, "rb") as f: digest = hashlib.sha256(f.read()).hexdigest()
          rustc_vv = subprocess.run(["rustc", "-vV"], capture_output=True, text=True, check=True).stdout.strip()
          host = next(l.split(": ", 1)[1] for l in rustc_vv.splitlines() if l.startswith("host: "))
          manifest = {
              "schema_version": 1,
              "evcxr_jupyter_version": evcxr_version,
              "rustc_vV": rustc_vv,
              "host_triple": host,
              "built_on": "ubuntu-22.04",
              "minimum_glibc": glibc,
              "files": {f"{name}.tar.gz": {"sha256": digest, "bytes": os.path.getsize(tarball)}},
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          with open(f"{stage}/{name}.manifest.json", "w") as f: json.dump(manifest, f, indent=2); f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
          ls -la "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: evcxr-prebuilt
          path: ${{ runner.temp }}/stage/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build-evcxr
    uses: ./.github/workflows/smoke-setup.yml
    with:
      prebuilt_artifact: evcxr-prebuilt

  publish:
    needs: smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evcxr-prebuilt
          path: ${{ runner.temp }}/stage

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-latest
          files: |
            ${{ runner.temp }}/stage/evcxr_jupyter-*.tar.gz
            ${{ runner.temp }}/stage/evcxr_jupyter-*.manifest.json
          make_latest: false
          prerelease: true
