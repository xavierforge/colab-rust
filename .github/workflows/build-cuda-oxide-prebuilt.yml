name: Build cuda-oxide prebuilt

# Builds cargo-oxide and librustc_codegen_cuda.so for one exact cuda-oxide
# commit, on the same ubuntu-22.04 / glibc 2.35 baseline as the evcxr
# prebuilt, and publishes them under an immutable per-commit release tag.
# setup-cuda-oxide.sh downloads the asset whose name matches the commit and
# nightly it is about to use, and falls back to a source build otherwise.
#
# No CUDA toolkit is needed here: cargo-oxide is deliberately CUDA-free and
# the backend loads libNVVM / nvJitLink at run time.

on:
  workflow_dispatch:
    inputs:
      cuda_oxide_rev:
        description: "Full cuda-oxide commit SHA to build"
        required: true
        default: "6abfaa091e29a6275c1943895bfbc97efa306e98"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch cuda-oxide at the requested commit
        env:
          REV: ${{ inputs.cuda_oxide_rev }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || { echo "cuda_oxide_rev must be a full 40-char SHA"; exit 1; }
          git init -q cuda-oxide
          cd cuda-oxide
          git remote add origin https://github.com/NVlabs/cuda-oxide.git
          git fetch -q --depth 1 origin "$REV"
          git checkout -q FETCH_HEAD
          echo "cuda-oxide $(git rev-parse --short=12 HEAD) $(git log -1 --format=%cd --date=short)"

      - name: Install the nightly pinned by cuda-oxide
        run: |
          set -euo pipefail
          cd cuda-oxide
          CHANNEL=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          ARGS=()
          for c in $(sed -n '/^components *= *\[/,/\]/p' rust-toolchain.toml | grep -o '"[^"]*"' | tr -d '"'); do ARGS+=(--component "$c"); done
          echo "channel=$CHANNEL ${ARGS[*]}"
          rustup toolchain install "$CHANNEL" --profile minimal "${ARGS[@]}"
          rustc -vV
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Build cargo-oxide (release)
        run: |
          set -euo pipefail
          cd cuda-oxide
          cargo build --release -p cargo-oxide
          ls -la target/release/cargo-oxide

      - name: Build the codegen backend (same invocation as cargo oxide setup)
        run: |
          set -euo pipefail
          cd cuda-oxide/crates/rustc-codegen-cuda
          cargo build --lib --target host-tuple --target-dir target
          SO=$(ls target/*/debug/librustc_codegen_cuda.so)
          ls -la "$SO"
          echo "BACKEND_SO=$PWD/$SO" >> "$GITHUB_ENV"

      - name: Package with manifest
        env:
          REV: ${{ inputs.cuda_oxide_rev }}
        run: |
          set -euo pipefail
          # The clone carries the toolchain pin; this step runs outside it, so ask the nightly explicitly.
          HOST=$(rustup run "$CHANNEL" rustc -vV | sed -n 's/^host: //p')
          GLIBC=$(ldd --version | head -1 | awk '{print $NF}')
          SHORT=${REV:0:12}
          NAME="cuda-oxide-${SHORT}-${CHANNEL}-${HOST}-glibc${GLIBC}"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE/bin" "$STAGE/lib"
          cp cuda-oxide/target/release/cargo-oxide "$STAGE/bin/"
          cp "$BACKEND_SO" "$STAGE/lib/librustc_codegen_cuda.so"
          UNSTRIPPED=$(stat -c %s "$STAGE/lib/librustc_codegen_cuda.so")
          strip --strip-debug "$STAGE/lib/librustc_codegen_cuda.so"
          STRIPPED=$(stat -c %s "$STAGE/lib/librustc_codegen_cuda.so")
          echo "backend .so: $UNSTRIPPED bytes with debuginfo, $STRIPPED bytes after strip --strip-debug"
          python3 - "$STAGE" "$REV" "$CHANNEL" "$HOST" "$GLIBC" "$UNSTRIPPED" <<'PY'
          import hashlib, json, subprocess, sys, os, datetime
          stage, rev, channel, host, glibc, unstripped = sys.argv[1:]
          def sha(p):
              with open(p, "rb") as f: return hashlib.sha256(f.read()).hexdigest()
          rustc_vv = subprocess.run(["rustup", "run", channel, "rustc", "-vV"], capture_output=True, text=True, check=True).stdout.strip()
          manifest = {
              "schema_version": 1,
              "cuda_oxide_rev": rev,
              "rust_toolchain": channel,
              "rustc_vV": rustc_vv,
              "host_triple": host,
              "built_on": "ubuntu-22.04",
              "minimum_glibc": glibc,
              "backend_build": "debug profile as built by `cargo oxide setup`, then strip --strip-debug",
              "backend_unstripped_bytes": int(unstripped),
              "files": {
                  "bin/cargo-oxide": {"sha256": sha(f"{stage}/bin/cargo-oxide"), "bytes": os.path.getsize(f"{stage}/bin/cargo-oxide")},
                  "lib/librustc_codegen_cuda.so": {"sha256": sha(f"{stage}/lib/librustc_codegen_cuda.so"), "bytes": os.path.getsize(f"{stage}/lib/librustc_codegen_cuda.so")},
              },
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          with open(f"{stage}/manifest.json", "w") as f: json.dump(manifest, f, indent=2); f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/$NAME.tar.gz" "$NAME"
          cp "$STAGE/manifest.json" "$GITHUB_WORKSPACE/$NAME.manifest.json"
          ls -la "$GITHUB_WORKSPACE/$NAME".*
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload to the per-commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ASSET_NAME }}
          name: ${{ env.ASSET_NAME }}
          body: |
            Prebuilt `cargo-oxide` and `librustc_codegen_cuda.so` for cuda-oxide `${{ inputs.cuda_oxide_rev }}` on `${{ env.CHANNEL }}`, built on ubuntu-22.04. Consumed by `setup-cuda-oxide.sh`; not meant for direct download.
          files: |
            ${{ env.ASSET_NAME }}.tar.gz
            ${{ env.ASSET_NAME }}.manifest.json
          make_latest: false
          prerelease: true
